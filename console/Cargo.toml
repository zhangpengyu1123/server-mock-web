[workspace]
resolver = "2"
# W 端 Tauri 壳是**独立** workspace（desktop/ 有自己的 Cargo.toml）：
# 它需要 WebView2 + 系统构建工具，不该拖慢 L 端与核心层的日常编译。
members = ["crates/core", "apps/agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
argon2 = "0.5"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
