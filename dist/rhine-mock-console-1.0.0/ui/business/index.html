<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>业务面 · RHINE LAB PLANE</title>
<meta name="color-scheme" content="light" />
<link rel="stylesheet" href="../shared/base.css" />
<!-- 入口重定向：/business/ 现在默认进新版六工作台（plane.html） -->
<meta http-equiv="refresh" content="0; url=./plane.html" />
<style>
  html, body { height: 100%; }
  .boot {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    font: 500 11px/1.9 "JetBrains Mono", "PingFang SC", monospace;
    letter-spacing: .18em; color: #1b1916; text-align: center;
  }
  .boot__k { font-size: 9px; letter-spacing: .34em; color: rgba(27,25,22,.45); }
  .boot__b { font-size: 13px; letter-spacing: .30em; }
  .boot__l { width: 160px; height: 1px; background: rgba(27,25,22,.14); overflow: hidden; }
  .boot__l i { display: block; width: 40%; height: 1px; background: #a67d48; animation: bootRun 1.1s ease-in-out infinite; }
  @keyframes bootRun { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
  .boot__a { font-size: 10px; letter-spacing: .12em; color: rgba(27,25,22,.55); }
  .boot__a a { color: #a67d48; text-decoration: none; border-bottom: 1px solid rgba(166,125,72,.4); }
</style>
</head>
<body>
<div class="boot">
  <div class="boot__k">RHINE LAB · PLANE</div>
  <div class="boot__b">业 务 面</div>
  <div class="boot__l"><i></i></div>
  <div class="boot__a">正在进入新版业务面…<br />若没有自动跳转，点这里 <a href="./plane.html">打开 plane.html</a></div>
  <div class="boot__a" style="opacity:.5">旧版快速 Mock 看板已归档：<a href="./legacy.html">legacy.html</a></div>
</div>
<script>
  // meta refresh 之外再补一次 JS 跳转（部分壳内 WebView 不执行 meta refresh）
  (function () {
    var t = setTimeout(function () { location.replace('./plane.html'); }, 0);
    // 带上原 hash/query 打开，便于直接落到某个工作台
    var extra = (location.hash || '');
    if (extra) {
      clearTimeout(t);
      location.replace('./plane.html' + extra);
    }
  })();
</script>
</body>
</html>
