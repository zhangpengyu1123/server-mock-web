<!doctype html>
<html lang="zh-CN" data-v8="blackbox">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BLACKBOX TERMINAL · mock 平台</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body class="nier">

<!-- ============================================================ 启动自检（参考图 5） -->
<div class="boot" id="boot">
  <div class="boot__scan" aria-hidden="true"></div>
  <div class="boot__body">
    <div class="boot__head">
      <h1 class="boot__title">正 在 加 载<span class="boot__titleSub">- 正在启动系统...</span></h1>
      <div class="boot__spin" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
    <ol class="boot__log" id="bootLog" aria-live="polite"></ol>
    <div class="boot__mark" aria-hidden="true">
      <svg class="crest" viewBox="0 0 140 190">
        <g fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M70 8 L92 46 L92 96 L70 134 L48 96 L48 46 Z" />
          <path d="M70 26 L82 50 L82 92 L70 116 L58 92 L58 50 Z" />
          <path d="M48 60 L20 78 L20 118 L48 100" />
          <path d="M92 60 L120 78 L120 118 L92 100" />
          <path d="M70 44 L79 62 L79 86 L70 104 L61 86 L61 62 Z" />
          <circle cx="70" cy="74" r="7" />
        </g>
        <g stroke="currentColor" stroke-width="1.2" opacity=".55">
          <path d="M70 8 L70 134 M48 46 L92 96 M92 46 L48 96" />
          <path d="M20 146 L120 146 M34 156 L106 156 M48 166 L92 166" />
        </g>
      </svg>
      <div class="wordmark">BLACKBOX</div>
      <div class="tagline">FOR THE RECORD OF MANKIND</div>
    </div>
  </div>
  <div class="boot__foot">
    <span>MOCK PLATFORM · TERMINAL BUILD 8.0</span>
    <span id="bootClock">--:--:--</span>
  </div>
</div>

<!-- ============================================================ 主界面 -->
<div class="stage" id="stage">

  <div class="grain" aria-hidden="true"></div>
  <div class="diag" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="frame" aria-hidden="true"></div>

  <!-- 顶部页签（参考图：深色条 + 激活块 + 像素图标） -->
  <div class="tabsbar">
    <div class="modes" id="modes" role="group" aria-label="模式">
      <button class="mode is-on" type="button" data-mode="run" aria-pressed="true"><b>运行台</b><i>OPERATION</i></button>
      <button class="mode" type="button" data-mode="prep" aria-pressed="false"><b>准备台</b><i>PREPARATION</i></button>
    </div>
    <nav class="tabs" id="tabs" aria-label="界面">
      <button class="tab is-active" type="button" data-tab="run" data-screen="run" data-mode="run" aria-current="page" aria-label="运行台 OPERATION">
        <span class="tab__ico" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M16 5 L16 27 M10 12 L16 5 L22 12 M6 22 H26"/></svg></span>
        <span class="tab__tx"><span class="tab__lb">运行台</span><span class="tab__en">OPERATION</span></span>
      </button>
      <button class="tab" type="button" data-tab="audit" data-screen="audit" data-mode="run" aria-label="审计 AUDIT">
        <span class="tab__ico" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 8 H27 M5 16 H27 M5 24 H20 M3 6 V26"/></svg></span>
        <span class="tab__tx"><span class="tab__lb">审计</span><span class="tab__en">AUDIT</span></span>
      </button>
      <button class="tab" type="button" data-tab="gate" data-screen="gate" data-mode="run" aria-label="闸门 GATE">
        <span class="tab__ico" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 4 V28 M22 4 V28 M6 16 H22 M18 11 L22 16 L18 21"/></svg></span>
        <span class="tab__tx"><span class="tab__lb">闸门</span><span class="tab__en">GATE</span></span>
      </button>
      <button class="tab" type="button" data-tab="mock" data-screen="mock" data-mode="prep" aria-label="接入 INGRESS">
        <span class="tab__ico" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M16 8 V24 M8 16 H24 M11 11 h2 v2 h-2z M19 11 h2 v2 h-2z"/></svg></span>
        <span class="tab__tx"><span class="tab__lb">接入</span><span class="tab__en">INGRESS</span></span>
      </button>
      <button class="tab" type="button" data-tab="flow" data-screen="flow" data-mode="prep" aria-label="接口 RECIPE">
        <span class="tab__ico" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 10 H27 M5 16 H27 M5 22 H27 M9 7 V19"/></svg></span>
        <span class="tab__tx"><span class="tab__lb">接口</span><span class="tab__en">RECIPE</span></span>
      </button>
      <button class="tab" type="button" data-tab="ne" data-screen="ne" data-mode="prep" aria-label="网元 SPECIMEN">
        <span class="tab__ico" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M16 6 L24 10 V20 L16 26 L8 20 V10 Z"/></svg></span>
        <span class="tab__tx"><span class="tab__lb">网元</span><span class="tab__en">SPECIMEN</span></span>
      </button>
      <button class="tab" type="button" data-tab="omp" data-screen="omp" data-mode="prep" aria-label="平台 MANAGED">
        <span class="tab__ico" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 9 H26 M6 16 H26 M6 23 H26 M10 6 V12 M22 13 V19 M10 20 V26"/></svg></span>
        <span class="tab__tx"><span class="tab__lb">平台</span><span class="tab__en">MANAGED</span></span>
      </button>
      <button class="tab" type="button" data-tab="lcm" data-screen="lcm" data-mode="prep" aria-label="库房 PACKAGE">
        <span class="tab__ico" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M7 10 H25 V26 H7 Z M7 10 L16 4 L25 10 M16 10 V26"/></svg></span>
        <span class="tab__tx"><span class="tab__lb">库房</span><span class="tab__en">PACKAGE</span></span>
      </button>
      <button class="tab" type="button" data-tab="vlp" data-screen="vlp" data-mode="prep" aria-label="虚层 STACK">
        <span class="tab__ico" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M8 8 H24 M5 12 H27 M5 20 H27 M8 24 H24"/></svg></span>
        <span class="tab__tx"><span class="tab__lb">虚层</span><span class="tab__en">STACK</span></span>
      </button>
      <button class="tab" type="button" data-tab="sys" data-screen="sys" data-mode="both" aria-label="系统 SYSTEM">
        <span class="tab__ico" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M10 8 H22 V24 H10 Z M13 12 H19 M13 16 H19 M13 20 H17"/></svg></span>
        <span class="tab__tx"><span class="tab__lb">系统</span><span class="tab__en">SYSTEM</span></span>
      </button>
    </nav>

  </div>
  <div class="perf" aria-hidden="true"></div>

  <!-- 页标题 -->
  <header class="head">
    <div class="head__left">
      <h1 class="head__title" id="headTitle">接 入 层</h1>
      <p class="head__sub" id="headSub">- 端点与身份登记</p>
    </div>
    <span class="lockchip" id="lockChip">
      <b>运行中</b>准备台已锁
      <button class="blk" type="button" data-act="stopForPrep">停止并进入准备</button>
    </span>
    <div class="head__tools" id="headTools" role="group" aria-label="布局与配色">
      <label class="themedots" aria-hidden="true" style="display:none"></label>
      <select class="inp inp--sel themesel" id="themeSel" aria-label="配色">
        <option value="nier">暖纸 · 尼尔</option>
        <option value="white">纯白 · 瑞士</option>
        <option value="codex">蓝黑 · 专业</option>
      </select>
      <button class="lyt" type="button" data-side="l" aria-pressed="true" title="折叠列表栏（[）" aria-label="折叠列表栏">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect class="lyt__fillL" x="3" y="3.5" width="5" height="13"/><rect x="2.5" y="3" width="15" height="14"/><path d="M8.5 3 V17"/></svg>
      </button>
      <button class="lyt" type="button" data-side="r" aria-pressed="true" title="折叠状态栏（]）" aria-label="折叠状态栏">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect class="lyt__fillR" x="12" y="3.5" width="5" height="13"/><rect x="2.5" y="3" width="15" height="14"/><path d="M11.5 3 V17"/></svg>
      </button>
    </div>
    <div class="head__right" id="headRight"></div>
  </header>

  <!-- 三栏工作区 -->
  <main class="work">
    <section class="col col--list" id="colList" aria-label="列表">
      <button class="rail" type="button" data-side="l" aria-label="展开列表栏" title="展开列表栏（[）">
        <i class="rail__chev" aria-hidden="true">›</i>
        <span class="rail__lb" id="railLb">服务单元</span>
        <span class="rail__en" id="railEn">UNITS</span>
        <span class="rail__ct" id="railCt">3</span>
      </button>
      <div class="col__tag"><span class="col__tagIco"></span><b id="listTag">端点</b><i id="listTagEn">ENDPOINTS</i></div>
      <div class="listwrap">
        <ul class="list" id="list"></ul>
        <span class="scrollbar" aria-hidden="true"><i id="scrollThumb"></i></span>
      </div>
      <div class="listfoot" id="listFoot"></div>
    </section>

    <section class="col col--main" id="main" aria-label="详情"></section>

    <aside class="col col--status" id="colStatus" aria-label="状态">
      <button class="rail" type="button" data-side="r" aria-label="展开状态栏" title="展开状态栏（]）">
        <i class="rail__chev" aria-hidden="true">‹</i>
        <span class="rail__dot" id="railDot" aria-hidden="true"></span>
        <span class="rail__lb">状 态</span>
        <span class="rail__en">STATUS</span>
        <span class="rail__ct" id="railStat">—</span>
      </button>
      <div class="statusbody" id="status"></div>
    </aside>
  </main>

  <!-- 底部指令条（参考图：左侧粗条 + 文案 + 键位） -->
  <footer class="cmd">
    <span class="cmd__bar" aria-hidden="true"></span>
    <p class="cmd__text" id="cmdText">选择端点。</p>
    <div class="cmd__keys" id="cmdKeys"></div>
  </footer>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="../_shared/domain.js"></script>
<script src="../_shared/motion.js"></script>
<script src="../_shared/micro.js"></script>
<script src="../_shared/button-fx.js"></script>
<script src="./app.js"></script>
<script src="./screens.js"></script>
</body>
</html>
