# ============================================================================
# BLACKBOX TERMINAL —— 形态 A：只监听回环，靠 SSH 隧道访问（推荐起点）
#   /etc/nginx/conf.d/blackbox.conf
#   站点根：/srv/blackbox/current（软链到 releases/<时间戳>，升级=换链）
#   访问：ssh -N -L 8088:127.0.0.1:8088 user@vm  →  http://127.0.0.1:8088/
#   自检：sudo nginx -t && curl -fI http://127.0.0.1:8088/
# ============================================================================
server {
    listen      127.0.0.1:8088;
    server_name _;

    root  /srv/blackbox/current;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    # 目录式 URL：/v8-blackbox-terminal/ → 该目录的 index.html
    location / {
        try_files $uri $uri/ =404;
        # HTML 走协商缓存：升级后立刻生效，不需要用户清缓存
        expires -1;
    }

    # 文件名没有内容哈希，所以只给短缓存，避免发布后长时间拿旧文件
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|ico|woff2?|txt)$ {
        expires 10m;
        access_log off;
        try_files $uri =404;
    }

    # 不暴露隐藏文件（.git/.htpasswd 等）
    location ~ /\.(?!well-known) { deny all; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json image/svg+xml;

    # 站点是纯静态、无外部域，CSP 可以收得很紧
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    error_page 404 /index.html;
}
