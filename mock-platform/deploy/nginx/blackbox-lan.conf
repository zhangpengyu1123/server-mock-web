# ============================================================================
# BLACKBOX TERMINAL —— 形态 B：监听内网 + Basic Auth（给同事看）
#   /etc/nginx/conf.d/blackbox.conf  （替换 A 那份）
#   前提：htpasswd -c /etc/nginx/.htpasswd viewer
#   防火墙：只放行你的网段，例如 ufw allow from 192.168.1.0/24 to any port 8088
# ============================================================================
server {
    listen      8088;
    server_name _;

    root  /srv/blackbox/current;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    # 一层口令：演示站点不需要用户体系，但别敞开给整个网段随便看
    auth_basic           "BLACKBOX";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|ico|woff2?|txt)$ {
        expires 10m;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    error_page 404 /index.html;
}
