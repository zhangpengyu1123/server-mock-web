# ============================================================================
# 镜像内配置（容器里必须听 0.0.0.0；端口映射时再用 127.0.0.1 限流）
# ============================================================================
server {
    listen      8088;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|ico|woff2?|txt)$ {
        expires 10m;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    error_page 404 /index.html;
}
