# ============================================================================
# 形态 C：docker compose 一把起（端口只绑回环，容器只读）
#   在 mock-platform/ 下：node deploy/pack-site.mjs && docker compose -f deploy/docker-compose.yml up -d --build
#   日志：docker compose -f deploy/docker-compose.yml logs -f
# ============================================================================
services:
  blackbox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: blackbox:8.0
    container_name: blackbox
    ports:
      - "127.0.0.1:8088:8088"     # 只在本机回环暴露：外部仍走 SSH 隧道
    read_only: true               # 站点是静态的，根文件系统只读
    tmpfs:
      - /var/cache/nginx
      - /var/run
    mem_limit: 96m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/version.txt"]
      interval: 30s
      timeout: 3s
      retries: 3
