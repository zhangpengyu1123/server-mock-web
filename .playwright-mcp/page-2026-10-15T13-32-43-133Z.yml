    - generic [ref=f2e776]:
      - generic [ref=f2e777]:
        - heading "Questions, answered" [level=2] [ref=f2e778]
        - paragraph [ref=f2e779]: What's free, what's in Pro and how the pieces fit together.
      - generic [ref=f2e780]:
        - generic [ref=f2e781]:
          - button "What is included in the free library?" [ref=f2e782] [cursor=pointer]
          - paragraph [ref=f2e785]: "All 216 components and backgrounds on this site, across five categories: Text Animations, Animations, Components, Micro and Backgrounds. The three creative tools are free too. You can use all of it in personal and commercial projects, and it stays free."
        - generic [ref=f2e786]:
          - button "What does React Bits Pro add?" [ref=f2e787] [cursor=pointer]
          - paragraph [ref=f2e790]: 230 more animated components, 300 page sections, 300 app UI blocks, 15 complete Next.js templates and 20 agent skills for AI coding tools. Like the free library, everything installs as source you own.
        - generic [ref=f2e791]:
          - button "What are the four flavours?" [ref=f2e792] [cursor=pointer]
          - paragraph [ref=f2e795]: "Every component comes in JavaScript or TypeScript, styled with plain CSS or Tailwind. Pick yours in the Preferences menu in the header and every code tab and install command follows it. With the CLI, the ending of the name picks the flavour: JS-CSS, JS-TW, TS-CSS or TS-TW."
        - generic [ref=f2e796]:
          - button "Is React Bits only for React?" [ref=f2e797] [cursor=pointer]
          - paragraph [ref=f2e800]:
            - text: "The components on this site are built for React, so they work in Next.js, Vite, Astro or Remix. Working in another framework? There are official ports for Vue and Svelte:"
            - link [ref=f2e801] [cursor=pointer]:
              - /url: https://vue-bits.dev/
              - text: Vue Bits
            - text: and
            - link [ref=f2e802] [cursor=pointer]:
              - /url: https://sveltebits.xyz/
              - text: Svelte Bits
            - text: .
        - generic [ref=f2e803]:
          - button "What are the tools for?" [ref=f2e804] [cursor=pointer]
          - paragraph [ref=f2e807]:
            - text: Background Studio, Shape Magic and Texture Lab are free apps that run in your browser. Tune any animated background, design a logo mark with 3D materials or restyle photos and videos, then export code, images or video.
            - link [ref=f2e808] [cursor=pointer]:
              - /url: /tools
              - text: Open the tools
        - generic [ref=f2e809]:
          - button "Where do I get Pro, and what does it cost?" [ref=f2e810] [cursor=pointer]
          - paragraph [ref=f2e813]:
            - text: "On"
            - link [ref=f2e814] [cursor=pointer]:
              - /url: https://pro.reactbits.dev/?utm_source=reactbits.dev&utm_medium=landing-faq&utm_campaign=free-to-pro&utm_content=landing-faq
              - text: pro.reactbits.dev
            - text: . Plans start at $79 a year, or $129 once for lifetime access with every future update. You can browse the whole catalogue before you buy, and one template and one agent skill are free.
        - generic [ref=f2e815]:
          - button "Can I use React Bits in commercial projects?" [ref=f2e816] [cursor=pointer]
          - paragraph [ref=f2e819]: "Yes. The free library is licensed MIT + Commons Clause: use the components in any app, website or product, client work included, but don't sell, sublicense or redistribute the components themselves. A Pro license covers one developer for unlimited commercial projects."
        - generic [ref=f2e820]:
          - button "Do I need to install a package?" [ref=f2e821] [cursor=pointer]
          - paragraph [ref=f2e824]: No. The shadcn or jsrepo CLI copies the source into your project, or you can paste it in by hand. There is no react-bits dependency to keep updated, and it works in any React setup, including Vite, Next.js, Astro and Remix.
        - generic [ref=f2e825]:
          - button "Does it work with AI coding tools?" [ref=f2e826] [cursor=pointer]
          - paragraph [ref=f2e829]: Yes. Every component has a Copy for AI menu, docs pages export to Markdown, llms.txt maps the whole library and the shadcn MCP server lets your agent install components for you. Pro adds agent skills that teach Claude Code, Cursor and Copilot to build pages that look designed.
